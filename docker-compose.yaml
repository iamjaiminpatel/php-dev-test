version: "3"
services:
  database:
    image: mysql:8.0
    container_name: silverorange_mysql
    environment:
      MYSQL_ROOT_PASSWORD: silverorange
      MYSQL_DATABASE: silverorange
      MYSQL_USER: silverorange
      MYSQL_PASSWORD: silverorange
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: